spring.application.name=estudio-bdd

# PostgreSQL (suba com: docker compose up -d, na raiz do repositório)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estudiobdd}
spring.datasource.username=${DB_USER:estudiobdd}
spring.datasource.password=${DB_PASSWORD:estudiobdd}

# "update" cria/ajusta as tabelas e mantém os dados ao reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Mantido ligado nesta primeira versão para os controllers converterem
# entidades em DTOs (associações LAZY). Ponto a revisar nas próximas versões.
spring.jpa.open-in-view=true

# Origem da SPA liberada no CORS
app.cors.origens=http://localhost:5173,http://127.0.0.1:5173
